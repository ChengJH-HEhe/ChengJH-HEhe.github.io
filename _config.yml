locale: en-US
site_theme: default
title: Junhong Cheng
title_separator: '-'
name: Junhong Cheng
description: Computer science undergraduate at Shanghai Jiao Tong University, studying
  secure and efficient computing systems.
url: https://chengjh-hehe.github.io
baseurl: ''
repository: ChengJH-HEhe/ChengJH-HEhe.github.io
author:
  name: Junhong Cheng
  avatar: junhong-monogram.svg
  bio: CS undergraduate · ACM Honors Class<br>Secure and efficient computing systems
  employer: Shanghai Jiao Tong University
  email: cheng_junhong_2023@sjtu.edu.cn
  github: ChengJH-HEhe
publication_category:
  manuscripts:
    title: Manuscripts
teaser: null
breadcrumbs: false
words_per_minute: 160
future: false
read_more: disabled
talkmap_link: false
comments:
  provider: null
  disqus:
    shortname: null
  discourse:
    server: null
  facebook:
    appid: null
    num_posts: null
    colorscheme: null
staticman:
  allowedFields:
  - name
  - email
  - url
  - message
  branch: gh-pages
  commitMessage: New comment.
  filename: comment-{@timestamp}
  format: yml
  moderation: true
  path: _data/comments/{options.slug}
  requiredFields:
  - name
  - email
  - message
  transforms:
    email: md5
  generatedFields:
    date:
      type: date
      options:
        format: iso8601
atom_feed:
  hide: false
  path: null
google_site_verification: null
bing_site_verification: null
alexa_site_verification: null
yandex_site_verification: null
twitter:
  username: null
facebook:
  username: null
  app_id: null
  publisher: null
og_image: null
og_description: null
social:
  type: null
  name: null
  links: null
analytics:
  provider: 'false'
  google:
    tracking_id: null
include:
- .htaccess
- _pages
- files
exclude:
- '*.sublime-project'
- '*.sublime-workspace'
- .asset-cache
- .bundle
- .github
- .jekyll-assets-cache
- .sass-cache
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
- CHANGELOG
- Capfile
- config
- Dockerfile
- Gemfile
- Gruntfile.js
- gulpfile.js
- LICENSE
- local
- log
- node_modules
- package.json*
- Rakefile
- README
- tmp
- vendor
- AGENTS.md
- CONTRIBUTING.md
- MIGRATION.md
- Gemfile.lock
- docker-compose.yaml
- _config_docker.yml
keep_files:
- .git
- .svn
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: '


  '
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
collections:
  publications:
    output: true
    permalink: /:collection/:path/
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: single
    author_profile: true
    read_time: true
    comments: false
    share: false
    related: true
- scope:
    path: ''
    type: pages
  values:
    layout: single
    author_profile: true
    comments: false
    share: false
- scope:
    path: ''
    type: publications
  values:
    layout: single
    author_profile: true
    share: false
    comments: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: America/Los_Angeles
plugins:
- jekyll-feed
- jekyll-gist
- jekyll-paginate
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
whitelist:
- jekyll-feed
- jekyll-gist
- jekyll-paginate
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
